# Compose usado por staging/produção (item 9 + item 10). Não entra em
# `pnpm docker:up` — o compose da raiz continua só para desenvolvimento local.
#
# Imagens: ghcr.io/<owner>/<repo>/{api,web}:<tag>
# O host precisa ter o repositório clonado (para este arquivo) e login no GHCR.
#
# Produção típica (Postgres/n8n gerenciados fora):
#   docker compose --env-file .env -f infra/deploy/docker-compose.yml up -d
#
# Staging self-contained (Postgres + n8n no mesmo host):
#   COMPOSE_PROFILES=deps docker compose --env-file .env \
#     -f infra/deploy/docker-compose.yml up -d
# Nesse modo, DATABASE_URL deve apontar para o serviço `postgres`
# (ver infra/deploy/.env.staging.example).

services:
  postgres:
    profiles: [deps]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orcadom_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - orcadom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-orcadom} -d ${POSTGRES_DB:-orcadom_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    profiles: [deps]
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-orcadom_db}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-orcadom}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: America/Sao_Paulo
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY}
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET}
      # n8n 2 bloqueia $env nos nodes por padrão; o workflow lê ORCADOM_API_URL.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      ORCADOM_API_URL: ${ORCADOM_API_URL:-http://api:8080}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
    ports:
      - '${N8N_PORT:-5678}:5678'
    volumes:
      - orcadom_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${GHCR_IMAGE_PREFIX}/api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-12h}
      JWT_REFRESH_REMEMBER_EXPIRATION: ${JWT_REFRESH_REMEMBER_EXPIRATION:-30d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-}
      IMPORT_EMAIL_MAILBOX: ${IMPORT_EMAIL_MAILBOX:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:orcadom@localhost}
      REPORTS_DIR: ${REPORTS_DIR:-/app/data/reports}
      THROTTLE_DEFAULT_LIMIT: ${THROTTLE_DEFAULT_LIMIT:-120}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-5}
      THROTTLE_AUTOMATION_LIMIT: ${THROTTLE_AUTOMATION_LIMIT:-60}
      THROTTLE_DISABLED: ${THROTTLE_DISABLED:-false}
    volumes:
      - orcadom_reports:/app/data/reports
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    image: ${GHCR_IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-http://api:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  orcadom_reports:
    name: orcadom_reports
  orcadom_pgdata:
    name: orcadom_pgdata
  orcadom_n8n_data:
    name: orcadom_n8n_data
