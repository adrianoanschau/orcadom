name: Changeset Check

on:
  pull_request:
    # `labeled` faz o check rodar de novo quando a label no-changeset entra
    # depois do PR aberto. Sem isso o evento original não vê a label.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # Changesets 3 chama enableCompileCache, que só existe no Node 22.11+.
      # O restante do CI continua no Node 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verifica changeset pendente
        if: "${{ github.event.pull_request.title != 'chore: release' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}"
        run: |
          pnpm changeset status --since=origin/main
