name: Tag Release

on:
  push:
    branches: [main]

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Lê a versão atual
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cria a tag
        run: |
          version="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${version}" | grep -q .; then
            echo "Tag ${version} já existe — segue para as imagens."
          else
            git tag "${version}"
            git push origin "${version}"
          fi

  images:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.ghcr.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Prefixo GHCR
        id: ghcr
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ghcr.outputs.prefix }}/api:v${{ needs.tag.outputs.version }}
            ${{ steps.ghcr.outputs.prefix }}/api:${{ needs.tag.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build e push do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ghcr.outputs.prefix }}/web:v${{ needs.tag.outputs.version }}
            ${{ steps.ghcr.outputs.prefix }}/web:${{ needs.tag.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  release:
    needs: [tag, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Monta o corpo da Release
        run: |
          prefix="${{ needs.images.outputs.prefix }}"
          version="${{ needs.tag.outputs.version }}"
          {
            echo "## Container images"
            echo
            echo "- \`${prefix}/api:v${version}\`"
            echo "- \`${prefix}/web:v${version}\`"
            echo
            echo "## Changelog"
            echo
            cat CHANGELOG.md
          } > /tmp/release-body.md

      - name: Cria a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          body_path: /tmp/release-body.md
          generate_release_notes: false
