name: Preview

# O preview só sobe se o PR tiver a label `preview`. Tirar a label
# remove o preview. PRs em rascunho com a label também sobem; para
# ignorá-los, acrescente `&& github.event.pull_request.draft == false`
# no `if` do job `check`.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  check:
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment preview — preview pulado."
          fi

      - name: Configura SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verifica vaga de preview
        id: slot
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy-preview --check ${PR_NUMBER}"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "slot=ok" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 75 ]; then
            echo "slot=full" >> "$GITHUB_OUTPUT"
          else
            echo "::error::deploy-preview --check saiu com código ${code}."
            exit "$code"
          fi

  limit:
    needs: check
    if: >-
      needs.check.outputs.slot == 'full' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Comenta o limite no PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- orcadom-preview -->';
            const body = [
              marker,
              '⚠️ Limite de 2 previews simultâneos atingido. Feche/mergeie outro PR ou peça para liberar uma vaga; depois faça um novo push ou reabra este PR.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Falha porque o limite foi atingido
        run: |
          echo "::error::Limite de 2 previews simultâneos atingido."
          exit 1

  build:
    needs: check
    if: >-
      needs.check.outputs.slot == 'ok' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment preview — preview pulado."
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.enabled == 'true'

      - name: Prefixo e tag
        id: meta
        if: steps.guard.outputs.enabled == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${PR_NUMBER}-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: docker/login-action@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da API
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build e push do web
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            APP_VERSION_SUFFIX=pr.${{ github.event.pull_request.number }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/web:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build e push do migrate
        if: steps.guard.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/database/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/migrate:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/migrate:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.tag != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.orcadom.aanschau.tech
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment preview — preview pulado."
          fi

      - name: Configura SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sobe o preview no VPS
        id: preview
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy-preview ${PR_NUMBER} ${IMAGE_TAG}"
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "limited=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "::error::deploy-preview saiu com código ${code}."
            exit "$code"
          else
            echo "limited=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comenta o limite no PR
        if: steps.preview.outputs.limited == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- orcadom-preview -->';
            const body = [
              marker,
              '⚠️ Limite de 2 previews simultâneos atingido. Feche/mergeie outro PR ou peça para liberar uma vaga; depois faça um novo push ou reabra este PR.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Falha porque o limite foi atingido
        if: steps.preview.outputs.limited == 'true'
        run: |
          echo "::error::Limite de 2 previews simultâneos atingido."
          exit 1

      - name: Comenta a URL do preview
        if: steps.guard.outputs.enabled == 'true' && steps.preview.outputs.limited == 'false'
        uses: actions/github-script@v9
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- orcadom-preview -->';
            const pr = process.env.PR_NUMBER;
            const web = `https://pr-${pr}.orcadom.aanschau.tech`;
            const api = `https://api-pr-${pr}.orcadom.aanschau.tech/api/docs`;
            const sha = (process.env.HEAD_SHA ?? '').slice(0, 7);
            const body = [
              marker,
              `Preview do PR #${pr} no ar.`,
              '',
              `- Web: ${web}`,
              `- API (Swagger): ${api}`,
              `- Imagem: \`${process.env.IMAGE_TAG}\``,
              `- Commit: \`${sha}\``,
              '',
              'Contas do seed (senha `staging-orcadom`):',
              '- owner@staging.orcadom.local',
              '- member@staging.orcadom.local',
              '- solo@staging.orcadom.local',
              '',
              `O banco deste preview é isolado (\`orcadom_pr_${pr}\`) e é apagado quando o PR fecha.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    if: >-
      (
        github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      ) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment preview — preview pulado."
          fi

      - name: Configura SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Remove o preview no VPS
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "destroy-preview ${PR_NUMBER}"

      - name: Comenta que o preview foi removido
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- orcadom-preview -->';
            const body = `${marker}\n🧹 Preview removido.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => (comment.body ?? '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
