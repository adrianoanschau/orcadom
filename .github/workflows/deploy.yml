name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (e.g. v0.12.0)'
        required: true
        type: string
      target:
        description: 'Environment'
        type: choice
        options: [staging, production, both]
        default: both

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    if: >
      github.event_name == 'release' ||
      inputs.target == 'both' ||
      inputs.target == matrix.environment
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ENABLED não é true no environment ${{ matrix.environment }} — skip."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Instala dependências
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Aplica migrations (prisma migrate deploy)
        if: steps.guard.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:deploy

      - name: Prefixo GHCR
        if: steps.guard.outputs.enabled == 'true'
        id: ghcr
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sobe as imagens no host
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_IMAGE_PREFIX: ${{ steps.ghcr.outputs.prefix }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/orcadom' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u token --password-stdin
            cd "$DEPLOY_PATH"
            export GHCR_IMAGE_PREFIX IMAGE_TAG
            docker compose --env-file .env -f infra/deploy/docker-compose.yml pull
            docker compose --env-file .env -f infra/deploy/docker-compose.yml up -d
