# Rollback (ou redeploy) de uma tag que já está no GHCR.
# Não roda migration no runner: deploy-prod no VPS aplica prisma migrate
# deploy dentro do container migrate e depois sobe a stack.
#
# Tags antigas (≤ v0.15.1) não têm imagem migrate e não servem aqui.
# Se um dia existir host de staging, ele segue o mesmo modelo com outro
# environment — não há matrix neste workflow.

name: Deploy manual / rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem já publicada (ex.: v0.16.0 ou sha-3f2a1b9c0d4e)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orcadom.aanschau.tech
    steps:
      - name: Confere se o deploy está habilitado
        id: guard
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment production — deploy pulado."
          fi

      - name: Confere a tag
        id: tag
        if: steps.guard.outputs.enabled == 'true'
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag de imagem inválida."
            exit 1
          fi
          echo "value=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configura SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy da tag no VPS
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy-prod ${IMAGE_TAG}"
