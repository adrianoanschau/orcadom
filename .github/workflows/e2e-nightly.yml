name: E2E Nightly

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orcadom
          POSTGRES_PASSWORD: orcadom
          POSTGRES_DB: orcadom_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcadom -d orcadom_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orcadom:orcadom@127.0.0.1:5432/orcadom_e2e?schema=public
      JWT_ACCESS_SECRET: e2e-access-secret-not-for-prod
      JWT_REFRESH_SECRET: e2e-refresh-secret-not-for-prod
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 12h
      JWT_REFRESH_REMEMBER_EXPIRATION: 30d
      COOKIE_SECURE: 'false'
      CRON_DISABLED: 'true'
      THROTTLE_DISABLED: 'true'
      WEB_ORIGIN: http://127.0.0.1:3000
      PORT: '8080'
      E2E_API_URL: http://127.0.0.1:8080
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gera o client Prisma
        run: pnpm --filter @orcadom/database db:generate

      - name: Aplica migrations
        run: pnpm db:migrate:deploy

      - name: Build da API (e deps)
        run: pnpm turbo run build --filter=@orcadom/api

      - name: Sobe a API
        run: |
          pnpm --filter @orcadom/api start > /tmp/orcadom-api.log 2>&1 &
          echo $! > /tmp/orcadom-api.pid
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "API pronta"
              exit 0
            fi
            sleep 1
          done
          echo "API não subiu a tempo"
          cat /tmp/orcadom-api.log
          exit 1

      - name: Suíte E2E completa
        run: pnpm test:e2e

      - name: Logs da API em falha
        if: failure()
        run: |
          test -f /tmp/orcadom-api.log && cat /tmp/orcadom-api.log || true
